<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Vinyl Now Playing V2">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Vinyl Now Playing V2</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="stylesheet" href="/app-v2.css">
  </head>
  <body class="v2-page">
    <main class="v2-shell">
      <section class="v2-main">
        <section class="v2-visual-stack" aria-label="Audio visualization">
          <div class="v2-art-wrap">
            <img id="cover" class="v2-cover hidden" alt="Album cover">
            <div id="recordFallback" class="v2-record-fallback" aria-hidden="true">
              <div class="v2-record-core"></div>
            </div>
          </div>

          <div class="v2-waveform-wrap">
            <canvas id="waveform" class="v2-waveform" aria-label="Live waveform"></canvas>
          </div>

          <div class="v2-meter-area">
            <div id="spectrumWrap" class="v2-spectrum-wrap hidden">
              <canvas id="spectrum" class="v2-spectrum" aria-label="Live spectrum analyzer"></canvas>
            </div>
            <div id="meterLeft" class="v2-vu-meter">
              <div class="v2-vu-face">
                <div class="v2-vu-scale">
                  <span>-40</span>
                  <span>-20</span>
                  <span>-10</span>
                  <span>-3</span>
                  <span>0</span>
                </div>
                <div class="v2-vu-arc"></div>
                <div id="needleLeft" class="v2-vu-needle"></div>
                <div class="v2-vu-pivot"></div>
              </div>
              <div class="v2-vu-label">
                <span>L</span>
                <strong id="leftDb">-</strong>
              </div>
            </div>
            <div id="meterRight" class="v2-vu-meter">
              <div class="v2-vu-face">
                <div class="v2-vu-scale">
                  <span>-40</span>
                  <span>-20</span>
                  <span>-10</span>
                  <span>-3</span>
                  <span>0</span>
                </div>
                <div class="v2-vu-arc"></div>
                <div id="needleRight" class="v2-vu-needle"></div>
                <div class="v2-vu-pivot"></div>
              </div>
              <div class="v2-vu-label">
                <span>R</span>
                <strong id="rightDb">-</strong>
              </div>
            </div>
          </div>
        </section>

        <section class="v2-track">
          <header class="v2-status" aria-live="polite">
            <div class="v2-status-line">
              <span id="statusDot" class="v2-status-dot"></span>
              <span id="statusText">Starting</span>
            </div>
            <span id="versionText" class="v2-version">v-</span>
          </header>
          <div class="v2-track-copy">
            <p id="artist" class="v2-artist">Waiting for the first recognition pass.</p>
            <h1 id="title">Listening...</h1>
          </div>
          <dl class="v2-meta">
            <div>
              <dt>Album</dt>
              <dd id="album">-</dd>
            </div>
            <div>
              <dt>Released</dt>
              <dd id="released">-</dd>
            </div>
            <div>
              <dt>Last Scan</dt>
              <dd id="lastScan">-</dd>
            </div>
            <div>
              <dt>Next Scan</dt>
              <dd id="nextScan">-</dd>
            </div>
          </dl>
        </section>

        <section class="v2-lyrics">
          <div class="v2-lyrics-header">
            <h2>Lyrics</h2>
            <div class="v2-lyrics-status">
              <strong id="lyricsMode">Waiting</strong>
              <span id="lyricsSource">LRCLIB</span>
            </div>
          </div>
          <div id="lyricsText" class="v2-lyrics-text">Lyrics will appear here when LRCLIB has a match.</div>
        </section>
      </section>
    </main>
    <script src="/app-v2.js"></script>
    <script src="/pwa.js"></script>
  </body>
</html>
